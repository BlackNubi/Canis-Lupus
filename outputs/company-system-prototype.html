function openModal(kind,values={}){const def=modalFields(kind);const inputs=def.fields.map(f=>{const [name,label,type,required,opts]=f;let control='';if(type==='select')control=`<select id="field-${name}" name="${name}" ${required?'required':''}>${opts.map(o=>`<option>${o}</option>`).join('')}</select>`;else if(type==='textarea')control=`<textarea id="field-${name}" name="${name}" ${required?'required':''} placeholder="Enter a sample value"></textarea>`;else control=`<input id="field-${name}" name="${name}" type="${type}" ${required?'required':''} ${type==='number'?'min="0"':''} placeholder="Enter a sample value">`;return `<div class="field ${type==='textarea'?'full':''}"><label for="field-${name}">${label}${required?' *':''}</label>${control}</div>`}).join('');document.getElementById('modal').innerHTML=`<div class="modal-head"><div><h2 id="modalTitle">${def.title}</h2><p>${def.intro}</p></div><button class="modal-close" aria-label="Close" data-action="close-modal">×</button></div><form class="modal-form" id="recordForm" data-kind="${kind}"><div class="field-grid">${inputs}</div><div class="modal-note">${def.note}</div><div class="modal-actions"><button type="button" class="btn" data-action="close-modal">Cancel</button><button type="submit" class="btn primary">Save demo record</button></div></form>`;document.getElementById('modalBackdrop').classList.add('open');document.querySelector('#recordForm input,#recordForm select,#recordForm textarea')?.focus()}
function showToast(m){const el=document.getElementById('toast');el.textContent=m;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),2800)}
function render(view=currentView){currentView=view;content.innerHTML=({dashboard,people:peopleView,recruiting:recruitingView,payroll:payrollView,benefits:benefitsView,time:timeView,timeoff:timeoffView,expenses:expensesView,invoices:invoicesView,vendors:vendorsView,spend:spendView,apps:appsView,devices:devicesView,learning:learningView,performance:performanceView,tasks:tasksView,reports:reportsView,automations:automationsView,policies:policiesView,settings:settingsView}[view]||dashboard)();document.querySelectorAll('.nav-item[data-view]').forEach(n=>n.classList.toggle('active',n.dataset.view===view));document.getElementById('sidebar').classList.remove('open');document.getElementById('scrim').classList.remove('open');window.scrollTo({top:0,behavior:'smooth'});}
function doClock(action){const c=state.clock,now=new Date();if(action==='clock-in'){c.status='working';c.clockInAt=now;c.breakMs=0;c.breakStartedAt=null;showToast('Clocked in · saved in this browser preview.')}else if(action==='break-toggle'){if(c.status==='working'){c.status='break';c.breakStartedAt=now;showToast('Break started · saved in this browser preview.')}else if(c.status==='break'){c.breakMs+=now-c.breakStartedAt;c.breakStartedAt=null;c.status='working';showToast('Break ended. You are clocked in again.')}}else if(action==='clock-out'){if(c.status==='break'&&c.breakStartedAt)c.breakMs+=now-c.breakStartedAt;const start=c.clockInAt instanceof Date?c.clockInAt:new Date(c.clockInAt);const mins=start&& !Number.isNaN(start.getTime())?Math.max(0,Math.round((now-start-c.breakMs)/60000)):0;const breakMinutes=Math.max(0,Math.round(c.breakMs/60000));state.timeEntries.unshift({employee:'Robert Lumumba',date:now.toLocaleDateString(undefined,{year:'numeric',month:'short',day:'numeric'}),workedMinutes:mins,breakMinutes,status:'Draft'});state.timeEntries=state.timeEntries.slice(0,100);c.status='out';c.clockInAt=null;c.breakStartedAt=null;c.breakMs=0;showToast(`Clocked out · ${mins} preview work minutes saved.`)}saveDemoState();render(currentView)}
function submitRecord(form){const data=Object.fromEntries([...new FormData(form).entries()].map(([k,v])=>[k,escapeText(String(v).trim())])),kind=form.dataset.kind;switch(kind){case'employee':state.people.unshift({name:data.fullName,role:data.role,team:data.team,location:data.location,type:data.workerType,status:'Active',email:data.email||'Sample profile'});break;case'candidate':state.candidates.push({name:data.fullName,role:data.role,stage:data.stage,location:data.location});break;case'invoice':state.invoices.unshift({id:`INV-DEMO-${String(state.invoices.length+1).padStart(3,'0')}`,client:data.client,date:'Today · demo',due:data.due,amount:Number(data.amount),status:'Pending approval'});break;case'expense':state.expenses.unshift({employee:data.employee,category:data.category,merchant:data.merchant,date:data.date,amount:Number(data.amount),status:'Pending'});break;case'vendor':state.vendors.push({name:data.name,type:data.type,terms:data.terms,status:'Active',bill:'—',due:'—',amount:0});break;case'bill':state.vendors.unshift({name:data.vendor,type:data.description,terms:'Review',status:'Review',bill:`BILL-DEMO-${state.vendors.length+1}`,due:data.due,amount:Number(data.amount)});break;case'app':state.apps.push({name:data.name,group:data.group,assigned:data.assigned,status:'Needs review'});break;case'device':state.devices.push({asset:data.asset,device:data.device,assigned:'Unassigned',location:data.location,status:'In stock'});break;case'course':state.courses.push({name:data.name,audience:data.audience,due:data.due,progress:0,status:'Not started'});break;case'goal':state.goals.unshift({objective:data.name,owner:data.owner,progress:0,status:'Not started',due:data.due||'Not set'});break;case'benefit':state.benefitPlans.unshift({name:data.name,detail:'Employee benefit plan',cost:'Configured by benefits team',enrolled:'No enrollments in this preview',note:`Provider: ${data.provider} · Eligibility: ${data.eligible}`,status:'Draft'});break;case'leave':{const from=new Date(`${data.start}T12:00:00`),to=new Date(`${data.end}T12:00:00`),days=Math.max(1,Math.round((to-from)/86400000)+1);state.leaveRequests.unshift([data.employee,data.type,`${data.start}–${data.end}`,days===1?'1 day':`${days} days`,'Pending']);break}case'automation':state.automations.push({name:data.name,trigger:data.trigger,action:data.action,scope:data.scope,status:false});break;case'task':state.tasks.push({title:data.title,owner:data.owner,due:data.due,status:'Pending',view:data.module});break;default:break}saveDemoState();document.getElementById('modalBackdrop').classList.remove('open');render(currentView);showToast('Saved in this browser preview. No company system was contacted.')}
function dispatch(el){const a=el.dataset.action,idx=Number(el.dataset.index);if(el.dataset.view){render(el.dataset.view);return}if(!a)return;switch(a){case'modal':openModal(el.dataset.kind);break;case'close-modal':document.getElementById('modalBackdrop').classList.remove('open');break;case'clock-in':case'clock-out':case'break-toggle':doClock(a);break;case'expense-decision':if(el.dataset.requestId)updateSharedRow('actriv_employee_requests_v1',el.dataset.requestId,el.dataset.status);else state.expenses[idx].status=el.dataset.status;saveDemoState();render('expenses');showToast(`Expense preview marked ${el.dataset.status.toLowerCase()}.`);break;case'leave-decision':if(el.dataset.requestId)updateSharedRow('actriv_employee_requests_v1',el.dataset.requestId,el.dataset.status);else state.leaveRequests[idx][4]=el.dataset.status;saveDemoState();render('timeoff');showToast(`Leave preview ${el.dataset.status.toLowerCase()}.`);break;case'invoice-decision':state.invoices[idx].status=el.dataset.status==='Approved'?'Payment processing':el.dataset.status;render();showToast('Sample invoice status updated. No money moved.');break;case'move-candidate':{const c=state.candidates[idx],s=['New applicant','Screening','Interview','Offer'];c.stage=s[Math.min(s.indexOf(c.stage)+1,s.length-1)];render();showToast(`${c.name} moved to ${c.stage}.`);break}case'automation-toggle':state.automations[idx].status=!state.automations[idx].status;render();showToast('Automation state changed in preview only.');break;case'payroll-preview':openModal('payroll');document.getElementById('modalTitle').textContent='Payroll preview · sample';document.querySelector('#recordForm .field-grid').innerHTML=`<div class="field full"><label>Pay period</label><input value="November 01–30, 2026" readonly></div><div class="field"><label>Sample employees</label><input value="276" readonly></div><div class="field"><label>Illustrative gross</label><input value="KES 48,200,000" readonly></div><div class="field full"><label>Review notes</label><textarea readonly>5 sample exceptions. Verify time, compensation changes, deductions, local tax rules, and approvals in a real payroll system.</textarea></div>`;document.querySelector('#recordForm .modal-note').textContent='Preview only · this does not calculate payroll, create pay statements, or send funds.';document.querySelector('#recordForm .modal-actions').innerHTML='<button type="button" class="btn" data-action="close-modal">Close preview</button><button type="button" class="btn primary" data-action="payroll-approve">Mark demo reviewed</button>';break;case'payroll-approve':state.payrollReviewedAt=new Date().toISOString();saveDemoState();document.getElementById('modalBackdrop').classList.remove('open');showToast('Demo payroll review marked complete. No pay run was submitted.');break;case'payroll-history':render('payroll');break;case'person-detail':{const p=state.people[idx];openModal('employee');document.getElementById('modalTitle').textContent=p.name;document.querySelector('#recordForm .field-grid').innerHTML=`<div class="field"><label>Role</label><input readonly value="${p.role}"></div><div class="field"><label>Department</label><input readonly value="${p.team}"></div><div class="field"><label>Location</label><input readonly value="${p.location}"></div><div class="field"><label>Worker type</label><input readonly value="${p.type}"></div><div class="field full"><label>Email</label><input readonly value="${p.email}"></div>`;document.querySelector('#recordForm .modal-note').textContent='Sample profile only · sensitive fields such as compensation, bank details, health information, and identity documents are not shown.';document.querySelector('#recordForm .modal-actions').innerHTML='<button type="button" class="btn" data-action="close-modal">Close</button><button type="button" class="btn primary" data-action="person-edit">Edit sample profile</button>';break}case'person-edit':document.getElementById('modalBackdrop').classList.remove('open');showToast('Profile editing is a prototype interaction.');break;case'invoice-detail':openModal('invoice');document.getElementById('modalTitle').textContent=state.invoices[idx].id+' · invoice details';document.querySelector('#recordForm .field-grid').innerHTML=`<div class="field"><label>Client</label><input readonly value="${state.invoices[idx].client}"></div><div class="field"><label>Amount</label><input readonly value="${money(state.invoices[idx].amount)}"></div><div class="field"><label>Status</label><input readonly value="${state.invoices[idx].status}"></div><div class="field"><label>Due</label><input readonly value="${state.invoices[idx].due}"></div>`;document.querySelector('#recordForm .modal-note').textContent='Sample invoice only. This record is not sent to a client.';document.querySelector('#recordForm .modal-actions').innerHTML='<button type="button" class="btn" data-action="close-modal">Close</button>';break;case'export':showToast('CSV export is not configured in this prototype.');break;case'refresh':showToast('Dashboard refreshed · demo data remains unchanged.');break;case'help':showToast('Help center connection is not configured.');break;case'accessibility':showToast('Use Tab and Enter for keyboard navigation.');break;case'notifications':showToast('Notifications are sample-only; no live alerts are connected.');break;case'app-assignment':openModal('app');document.getElementById('modalTitle').textContent='Manage '+state.apps[idx].name;document.querySelector('#recordForm .field-grid').innerHTML=`<div class="field"><label>Assigned group</label><input readonly value="${state.apps[idx].assigned}"></div><div class="field"><label>App status</label><input readonly value="${state.apps[idx].status}"></div><div class="field full"><label>Access group</label><select><option>Role-based group · sample</option><option>Department group · sample</option><option>Manual assignment · sample</option></select></div>`;document.querySelector('#recordForm .modal-note').textContent='No real app access changes are made.';document.querySelector('#recordForm .modal-actions').innerHTML='<button type="button" class="btn" data-action="close-modal">Close</button><button type="button" class="btn primary" data-action="access-save">Save preview</button>';break;case'access-save':document.getElementById('modalBackdrop').classList.remove('open');showToast('Access preview saved locally only.');break;case'device-assignment':openModal('device');document.getElementById('modalTitle').textContent='Manage '+state.devices[idx].asset;document.querySelector('#recordForm .field-grid').innerHTML=`<div class="field"><label>Device</label><input readonly value="${state.devices[idx].device}"></div><div class="field"><label>Assignment</label><select><option>${state.devices[idx].assigned}</option>${state.people.map(p=>`<option>${p.name}</option>`).join('')}</select></div>`;document.querySelector('#recordForm .modal-actions').innerHTML='<button type="button" class="btn" data-action="close-modal">Close</button><button type="button" class="btn primary" data-action="device-save" data-index="'+idx+'">Save preview</button>';break;case'device-save':{const sel=document.querySelector('#recordForm select');state.devices[idx].assigned=sel.value;state.devices[idx].status=sel.value==='Unassigned'?'In stock':'Assigned';document.getElementById('modalBackdrop').classList.remove('open');render();showToast('Device assignment updated in preview.');break}case'course-assignment':{const c=state.courses[idx];if(c){c.progress=Math.min(100,(Number(c.progress)||0)+25);c.status=c.progress>=100?'Complete':'In progress';saveDemoState();render('learning');showToast(`${c.name} progress updated to ${c.progress}% in this preview.`)}break}case'benefit-details':{const p=state.benefitPlans[idx];if(p){openModal('benefit');document.getElementById('modalTitle').textContent=escapeText(p.name)+' · plan preview';document.querySelector('#recordForm .field-grid').innerHTML=`<div class="field"><label>Plan type</label><input readonly value="${escapeText(p.detail)}"></div><div class="field"><label>Status</label><input readonly value="${escapeText(p.status)}"></div><div class="field"><label>Cost label</label><input readonly value="${escapeText(p.cost)}"></div><div class="field full"><label>Notes</label><textarea readonly>${escapeText(p.note)}</textarea></div>`;document.querySelector('#recordForm .modal-note').textContent='Sample benefits plan only. Enrollment and coverage are not updated.';document.querySelector('#recordForm .modal-actions').innerHTML='<button type="button" class="btn" data-action="close-modal">Close</button>'}break}case'move-candidate':break;case'report-open':showToast('Report source connection is not configured.');break;case'timesheet-review':{const row=el.dataset.record==='employee'?null:el.dataset.record==='clock'?state.timeEntries[idx]:state.timesheets[idx];const changed=el.dataset.record==='employee'?updateSharedRow('actriv_employee_time_entries_v1',el.dataset.id,'Reviewed'):row?(row.status='Reviewed',true):false;if(changed){saveDemoState();render('time');showToast('Timesheet preview marked reviewed. No payroll record was updated.')}break}case'timesheet-approve-all':{let count=0;for(const row of state.timesheets)if(row.status==='Needs review'){row.status='Approved';count++}for(const row of state.timeEntries)if(row.status==='Reviewed'){row.status='Approved';count++}for(const row of sharedEmployeeTimeEntries())if(row.status==='Reviewed'){row.status='Approved';count++}try{localStorage.setItem('actriv_employee_time_entries_v1',JSON.stringify(sharedEmployeeTimeEntries().map(row=>row)))}catch{}saveDemoState();render('time');showToast(`${count} eligible preview timesheet${count===1?'':'s'} approved. No payroll data was updated.`);break}case'leave-calendar':case'calendar-settings':case'policy-detail':case'policy-edit':case'role-review':case'spend-policy':case'travel-request':case'device-policy':case'device-checklist':case'learning-report':case'review-calendar':case'task-filter':case'invoice-settings':case'expense-policy':case'access-review':case'automation-templates':case'automation-edit':case'report-schedule':case'settings-audit':case'benefit-window':case'schedule-view':case'policy-detail':showToast('This settings panel is a prototype placeholder.');break;default:showToast('This action is available as a prototype preview only.')}}
document.addEventListener('click',e=>{const nav=e.target.closest('[data-view]');if(nav){render(nav.dataset.view);document.getElementById('searchPop').classList.remove('open');return}const action=e.target.closest('[data-action]');if(action){dispatch(action);saveDemoState()}if(!e.target.closest('.top-search'))document.getElementById('searchPop').classList.remove('open')});
document.addEventListener('submit',e=>{if(e.target.id==='recordForm'){e.preventDefault();submitRecord(e.target)}});
document.addEventListener('input',e=>{if(e.target.id==='peopleFilter'||e.target.id==='expenseFilter'||e.target.id==='invoiceFilter'){const q=e.target.value.toLowerCase();document.querySelectorAll('[data-search-row]').forEach(row=>row.hidden=!row.dataset.searchRow.includes(q))}if(e.target.id==='globalSearch')renderSearch(e.target.value)});
document.addEventListener('change',e=>{if(e.target.id==='peopleType'){document.querySelectorAll('[data-search-row]').forEach(r=>r.hidden=(e.target.value&& !r.innerText.includes(e.target.value))||(document.getElementById('peopleFilter')?.value&&!r.dataset.searchRow.includes(document.getElementById('peopleFilter').value.toLowerCase())))}if(e.target.id==='expenseStatus'||e.target.id==='invoiceStatus'){const status=e.target.value;document.querySelectorAll('[data-search-row]').forEach(r=>r.hidden=Boolean(status&&!r.innerText.includes(status)))}});
function renderSearch(q){const pop=document.getElementById('searchPop');if(!q.trim()){pop.classList.remove('open');return}const matches=Object.entries(views).filter(([k,v])=>(k+' '+v).toLowerCase().includes(q.toLowerCase())).slice(0,8);pop.innerHTML=matches.length?matches.map(([k,v])=>`<button data-view="${k}"><span class="type">Module</span><span>${v}</span></button>`).join(''):`<div class="empty-note">No matching modules. Try People, Payroll, Time, or Expenses.</div>`;pop.classList.add('open')}
document.getElementById('globalSearchForm').addEventListener('submit',e=>{e.preventDefault();const first=document.querySelector('#searchPop [data-view]');if(first)render(first.dataset.view)});
document.getElementById('mobileMenu').addEventListener('click',()=>{document.getElementById('sidebar').classList.toggle('open');document.getElementById('scrim').classList.toggle('open')});document.getElementById('scrim').addEventListener('click',()=>{document.getElementById('sidebar').classList.remove('open');document.getElementById('scrim').classList.remove('open')});document.getElementById('modalBackdrop').addEventListener('click',e=>{if(e.target.id==='modalBackdrop')e.currentTarget.classList.remove('open')});document.addEventListener('keydown',e=>{if(e.key==='Escape'){document.getElementById('modalBackdrop').classList.remove('open');document.getElementById('searchPop').classList.remove('open');document.getElementById('sidebar').classList.remove('open');document.getElementById('scrim').classList.remove('open')}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();document.getElementById('globalSearch').focus()}});
render();
